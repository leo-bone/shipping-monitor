name: Update Shipping Data

on:
  # 每天更新一次。主窗口 03:07 UTC（北京时间 11:07），补偿窗口 09:07 UTC。
  # GitHub 的定时任务在高峰时段可能延迟或被丢弃，补偿窗口负责兜底；
  # 下面的 guard 步骤保证当天已更新过就直接跳过，不会重复更新。
  schedule:
    - cron: '7 3 * * *'
    - cron: '7 9 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 今日是否已更新（补偿窗口幂等保护）
        id: guard
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%F)
          CUR=$(python3 -c "import json;print(json.load(open('public/data/full_data.json')).get('data_date',''))" 2>/dev/null || echo "")
          echo "今日: $TODAY | 当前数据日期: $CUR"
          if [ "$CUR" = "$TODAY" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今日数据已是 $TODAY，跳过本次补偿运行"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install requests

      - name: Run LLM update script
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "✅ GEMINI_API_KEY 已配置，使用 LLM 智能更新"
            python3 scripts/llm_update.py
          else
            echo "⚠️  GEMINI_API_KEY 未配置，使用基础脚本更新"
            python3 scripts/update_data.py
          fi

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          if git diff --staged --quiet; then
            echo "📭 数据无变化，跳过提交"
          else
            git commit -m "data: 自动更新水道数据 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M') 北京时间"
            git push origin main
          fi

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # 确保拿到最新 commit（包含刚更新的数据）

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
